name: Validate and register Keyper releases

on:
  pull_request:
    paths:
      - appcast.xml
      - scripts/register_releases.py
      - .github/workflows/register-keyper-releases.yml
  push:
    branches: [main]
    paths:
      - appcast.xml
      - scripts/register_releases.py
      - .github/workflows/register-keyper-releases.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate appcast release metadata
        run: python3 scripts/register_releases.py --validate-only appcast.xml

  register:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Register retained releases with Keyper
        env:
          KEYPER_RELEASE_TOKEN: ${{ secrets.KEYPER_RELEASE_TOKEN }}
        run: python3 scripts/register_releases.py appcast.xml
